name: Build installer

# Builds RazagathWoW-Setup.exe on a clean GitHub-hosted Windows machine and attaches it
# to the release under the FIXED name RazagathWoW-Setup.exe, so
#   https://github.com/<owner>/<repo>/releases/latest/download/RazagathWoW-Setup.exe
# always serves the newest installer. Players download it directly - nobody builds anything.
#
# Triggered when tools/build-release.ps1 publishes a release (it uploads the big patch files
# first). Can also be re-run by hand: Actions -> Build installer -> Run workflow -> tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the installer for (e.g. patch-2026.10.02b)"
        required: true

permissions:
  contents: write

concurrency:
  group: installer-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The release is created BEFORE the release commit (manifest + overlay add-ons) is pushed,
      # so wait until main carries this release's version before building from it.
      - name: Wait for the release commit on main
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^patch-', ''
          $v = ''
          for ($i = 0; $i -lt 30; $i++) {
            git fetch origin main --depth 1 -q
            git reset --hard origin/main -q
            $v = (Get-Content manifest.json -Raw | ConvertFrom-Json).clientVersion
            if ($v -eq $ver) { break }
            Write-Host "main has client $v, waiting for $ver ..."
            Start-Sleep -Seconds 20
          }
          if ($v -ne $ver) { throw "manifest.json on main is $v, expected $ver" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { throw 'makensis not found after install' }

      # The patch archives are no longer bundled into the installer (the launcher downloads them from manifest.json on its
      # first start), so there is nothing to fetch from the release here any more. That keeps the installer small and
      # identical between releases unless the launcher changes - good for antivirus / SmartScreen reputation.

      # The installer embeds the launcher that was PUBLISHED with this release (the exact file manifest.json points at) instead of
      # compiling a second copy on the runner. The launcher build is reproducible (launcher/build.ps1 /deterministic+) and the
      # installer is named/stamped with the LAUNCHER version, so RazagathWoW-Setup.exe is byte-identical from one client release to the
      # next until the launcher or installer source actually changes. That is what lets antivirus reputation and false-positive
      # allow-listing stick to one file.
      - name: Build the installer around the released launcher
        shell: pwsh
        run: |
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          $lv = $m.launcher.version
          New-Item -ItemType Directory -Force dist-launcher | Out-Null
          for ($i = 0; $i -lt 20; $i++) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'RazagathWoW.exe' --dir dist-launcher --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path dist-launcher/RazagathWoW.exe)) { break }
            Write-Host 'launcher asset not available yet, retrying ...'
            Start-Sleep -Seconds 15
          }
          if (-not (Test-Path dist-launcher/RazagathWoW.exe)) { throw 'RazagathWoW.exe not found on the release' }
          $got = (Get-FileHash dist-launcher/RazagathWoW.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $m.launcher.sha256.ToLower()) { throw "released launcher $got does not match manifest launcher $($m.launcher.sha256)" }
          "LV=$lv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./tools/build-installer.ps1 -Version $lv -LauncherExe dist-launcher/RazagathWoW.exe

      # --- Code signing (SignPath Foundation) ------------------------------------------------
      # Not enabled yet. Once the project is approved, sign BOTH dist/RazagathWoW.exe (before the
      # installer is built, so the signed launcher is what gets embedded) and the finished
      # installer, using signpath/github-action-submit-signing-request with an
      # organization id / project slug / API token secret. Because the launcher hash then
      # changes, the manifest's launcher entry must be refreshed from the signed file as well.

      - name: Attach installer to the release
        shell: pwsh
        run: |
          Copy-Item "dist/RazagathWoW-Setup-$env:LV.exe" dist/RazagathWoW-Setup.exe -Force
          gh release upload $env:TAG dist/RazagathWoW-Setup.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { throw 'upload failed' }
          Get-Item dist/RazagathWoW-Setup.exe | ForEach-Object { 'uploaded {0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      # Put the installer's SHA-256 and the "if Windows warns you" help on the release page (idempotent: the block after the
      # marker is replaced on a re-run).
      - name: Add the installer hash and download-safety notes to the release page
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RazagathWoW-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $body = (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n"
          $marker = '<!-- download-safety -->'
          if ($body -and $body.Contains($marker)) { $body = $body.Substring(0, $body.IndexOf($marker)).TrimEnd() }
          $footer = @'
          <!-- download-safety -->
          ---
          ### Downloading safely
          - **Installer:** `RazagathWoW-Setup.exe`, SHA-256 `@@HASH@@`. It is built automatically by GitHub Actions from the public source code in this repository (see the Actions tab); nothing is built on a private machine.
          - **If Windows warns you:** the installer is not code-signed yet, so Windows SmartScreen or your antivirus may warn about a new open-source launcher. On the blue "Windows protected your PC" screen click **More info**, then **Run anyway**. Or right-click the downloaded file, choose **Properties**, tick **Unblock**, then OK.
          - **Check it yourself:** in PowerShell run `Get-FileHash .\RazagathWoW-Setup.exe` and compare it with the hash above. Antivirus engines sometimes give unsigned launchers a generic "machine learning" detection; these are not detections of any specific malware.
          '@
          $footer = $footer.Replace('@@HASH@@', $hash)
          Set-Content -Path release_notes.md -Value ($body + "`n`n" + $footer) -Encoding utf8
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file release_notes.md
          if ($LASTEXITCODE) { throw 'could not update the release notes' }

      - uses: actions/upload-artifact@v4
        with:
          name: RazagathWoW-Setup
          path: dist/RazagathWoW-Setup.exe
          retention-days: 14
